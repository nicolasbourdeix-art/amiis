<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Même échelle qu'à l'ouverture directe de l'appli (page de 980 px que le
     téléphone réduit : l'interface mobile est réglée pour ça), sauf les pages
     de signature, prévues pour la largeur de l'écran. -->
<meta name="viewport" id="vp" content="width=980">
<script>
  if (/[?&](contrat|cession|ndf)=/.test(location.search)) document.getElementById('vp').content = 'width=device-width, initial-scale=1, viewport-fit=cover';
  else if (Math.min(screen.width, screen.height) < 900) document.documentElement.className = 'reduit';
</script>
<meta name="robots" content="noindex">
<title>AMIIS</title>
<!-- Installable (Chrome : menu ⋮ › Installer AMIIS) : l'appli s'ouvre sur l'accueil, sans bandeau Google. -->
<link rel="manifest" href="manifest-app.webmanifest">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="https://nicolasbourdeix-art.github.io/amiis/apple-touch-icon-v2.png">
<meta name="theme-color" content="#F7941D">
<style>
  html, body { margin: 0; height: 100%; background: #F6F3EE; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #2b2b2b; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  #attente { position: fixed; inset: 0; z-index: 2; background: #F6F3EE; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
  .sp { width: 52px; height: 52px; margin: 0 auto 18px; border: 5px solid #f3d9b5; border-top-color: #F7941D; border-radius: 50%; animation: t 1s linear infinite; }
  @keyframes t { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 8px; } p { font-size: 14px; color: #666; margin: 0 0 18px; }
  a { display: inline-block; background: #F7941D; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 12px; }
  #secours { visibility: hidden; }
  /* Écran d'attente lisible sur téléphone (page réduite à 980 px). */
  html.reduit .sp { width: 120px; height: 120px; border-width: 12px; margin-bottom: 40px; } html.reduit h1 { font-size: 48px; } html.reduit p { font-size: 34px; margin-bottom: 40px; } html.reduit a { font-size: 34px; padding: 26px 46px; border-radius: 26px; }
</style>
</head>
<body>
<div id="attente">
  <div>
    <div class="sp"></div>
    <h1>Association AMIIS</h1>
    <p>Ouverture de votre page… / Opening your page…</p>
    <a id="secours" href="#">Ouvrir directement / Open directly</a>
  </div>
</div>
<iframe id="app" title="AMIIS" allow="clipboard-write; camera; microphone; fullscreen"></iframe>
<script>
  // Page relais des liens envoyés par mail : affiche l'application AMIIS en
  // plein écran dans un cadre, avec les mêmes paramètres (code d'accès,
  // contrat à signer, dossier…). Intégrée ainsi, l'application n'a pas le
  // bandeau Google « créée par un utilisateur d'Apps Script ».
  var APP = 'https://script.google.com/macros/s/AKfycbz4gHbfrNc0zJN1CrLb5y6s1JuF32mAdR-yFUDsEH0RKcSutef6GppSAZFIkJxBPfQIZg/exec';
  // Ouverture directe (secours) : cadre=direct, sinon l'appli reviendrait ici.
  var qd = new URLSearchParams(location.search); qd.set('cadre', 'direct');
  var directe = APP + '?' + qd.toString() + (location.hash || '');
  var cadre = document.getElementById('app');
  document.getElementById('secours').href = directe;
  function charger(v) {
    var q = new URLSearchParams(location.search);
    q.set('cadre', 'relais'); if (v) q.set('v', v);
    cadre.src = APP + '?' + q.toString() + (location.hash || '');
  }
  var charge = false, basculee = false;
  cadre.addEventListener('load', function() { charge = true; document.getElementById('attente').style.display = 'none'; });
  // Certains téléphones Android (Chrome) ne transmettent pas les appuis à
  // l'appli dans ce cadre : la page défile mais aucun bouton ne répond.
  // Appuis reçus ici (et non par l'appli), ou signalés par l'appli : on
  // ouvre l'appli directement, sans cadre.
  function ouvrirSansCadre() { if (basculee) return; basculee = true; location.replace(directe); }
  var appuisIci = 0;
  document.addEventListener('touchstart', function(e) {
    if (!charge || (e.target && e.target.closest && e.target.closest('#attente'))) return;
    if (++appuisIci >= 2) ouvrirSansCadre();
  }, { capture: true, passive: true });
  charger('');
  // Si le cadre tarde (réseau, blocage du navigateur), lien d'ouverture directe.
  setTimeout(function() { document.getElementById('secours').style.visibility = 'visible'; }, 12000);
  // L'application signale une nouvelle version : on recharge le cadre.
  window.addEventListener('message', function(e) {
    var d = e.data || {};
    if (d.amiis === 'recharger') charger(String(Date.now()));
    else if (d.amiis === 'cadreDirect') ouvrirSansCadre();
  });
</script>
</body>
</html>
